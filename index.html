<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arunraj · Clinic Leads Tracker</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { background:#020617; color:#f8fafc; padding:18px; line-height:1.45; }
  .wrap { max-width:1000px; margin:0 auto; }
  .head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  h1 { font-size:22px; font-weight:800; } h1 span { color:#3b82f6; }
  .btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:9px 14px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover { background:#334155; }
  .btn.blue { background:#3b82f6; border-color:#3b82f6; } .btn.blue:hover { background:#2563eb; }
  .btn.wa { background:#25d366; border-color:#25d366; color:#052e16; font-weight:800; }
  .btn.red { background:#7f1d1d; border-color:#991b1b; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:12px; text-align:center; }
  .stat small { color:#94a3b8; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .stat b { display:block; font-size:22px; margin-top:4px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .bar input, .bar select, input, select, textarea { background:#020617; color:#fff; border:1px solid #334155; border-radius:8px; padding:9px 10px; font-size:14px; }
  .bar input { flex:1; min-width:200px; }
  textarea { width:100%; }
  .chk { font-size:13px; color:#cbd5e1; display:flex; gap:6px; align-items:center; }
  .panel { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:15px; margin-bottom:10px; color:#e2e8f0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
  .grid2 label, .hint { font-size:12px; color:#94a3b8; display:block; }
  .hint { margin-top:6px; }
  .cards { display:grid; gap:12px; }
  .card { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:14px 14px 14px 18px; position:relative; overflow:hidden; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:#64748b; }
  .card[data-st="Contacted"]::before { background:#3b82f6; }
  .card[data-st="Replied"]::before { background:#f59e0b; }
  .card[data-st="Won"]::before { background:#10b981; }
  .card[data-st="Rejected"]::before { background:#ef4444; }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .name { font-size:17px; font-weight:700; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .tag { font-size:11px; background:#1e293b; color:#cbd5e1; padding:2px 8px; border-radius:20px; }
  .tag.ok { background:#052e16; color:#86efac; }
  .tag.no { background:#2a1f05; color:#fcd34d; }
  .meta { color:#94a3b8; font-size:13px; margin-top:8px; }
  .meta b { color:#e2e8f0; font-weight:600; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .acts select { font-size:13px; padding:7px 10px; }
  .acts .btn { padding:7px 11px; font-size:13px; }
  .note { width:100%; margin-top:10px; font-size:13px; padding:8px; }
  .empty { text-align:center; padding:36px; color:#64748b; border:1px dashed #334155; border-radius:12px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#f8fafc; color:#020617; padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Arunraj's <span>Clinic Leads</span></h1>
    <div class="bar" style="margin:0">
      <button class="btn" onclick="document.getElementById('importFile').click()">Import Apify JSON</button>
      <button class="btn" onclick="exportData()">Backup</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importApify(this.files[0])">
    </div>
  </div>

  <div class="stats">
    <div class="stat"><small>Total leads</small><b id="sTotal">0</b></div>
    <div class="stat"><small>WhatsApp ready</small><b id="sWa" style="color:#86efac">0</b></div>
    <div class="stat"><small>Contacted</small><b id="sCon" style="color:#60a5fa">0</b></div>
    <div class="stat"><small>Replied</small><b id="sRep" style="color:#fbbf24">0</b></div>
    <div class="stat"><small>Won</small><b id="sWon" style="color:#34d399">0</b></div>
  </div>

  <div class="panel">
    <h2>WhatsApp message template</h2>
    <textarea id="tpl" rows="7"></textarea>
    <div class="bar" style="margin:8px 0 0">
      <button class="btn blue" onclick="saveTpl(true)">Save message</button>
      <button class="btn" onclick="resetTpl()">Reset to default</button>
      <span id="tplState" class="hint" style="margin:0"></span>
    </div>
    <span class="hint">Use {name} where the clinic name should go. Each clinic card's WhatsApp button uses the saved message.</span>
    <div class="hint" style="margin-top:8px"><b>Preview</b> (for the first clinic in the list):</div>
    <div id="tplPreview" style="white-space:pre-line;background:#020617;border:1px solid #334155;border-radius:8px;padding:10px;font-size:13px;color:#e2e8f0;margin-top:4px"></div>
  </div>

  <div class="panel">
    <h2>Add lead manually</h2>
    <div class="grid2">
      <label>Business name<input id="aName" style="width:100%"></label>
      <label>Phone (10 digits)<input id="aPhone" style="width:100%" inputmode="numeric"></label>
      <label>Category<input id="aNiche" style="width:100%" placeholder="Clinic"></label>
      <label>City / address<input id="aAddr" style="width:100%"></label>
    </div>
    <div class="bar" style="margin-top:10px"><button class="btn blue" onclick="addManual()">Add lead</button><span id="aMsg" class="hint" style="margin:0"></span></div>
  </div>

  <div class="bar">
    <input id="q" placeholder="Search name, phone, city..." oninput="render()">
    <select id="fStatus" onchange="render()">
      <option value="">All status</option><option>New</option><option>Contacted</option><option>Replied</option><option>Won</option><option>Rejected</option>
    </select>
    <select id="fSort" onchange="render()">
      <option value="rev">Most reviews</option><option value="rate">Highest rating</option><option value="name">Name A-Z</option>
    </select>
    <label class="chk"><input type="checkbox" id="fWa" onchange="render()"> Only WhatsApp numbers</label>
  </div>

  <div class="cards" id="list"></div>
</div>
<div class="toast" id="toast"></div>

  function saveTpl(show) {
    const v = $('tpl').value.trim();
    if (!v) return toast('Message is empty');
    localStorage.setItem('arunraj_tpl_v3', v);
    $('tplState').textContent = 'Saved';
    showPreview(); render();
    if (show) toast('Message saved. WhatsApp buttons updated.');
  }
  function resetTpl() {
    if (!confirm('Reset the message to the default text?')) return;
    localStorage.removeItem('arunraj_tpl_v3');
    $('tpl').value = DEFAULT_TPL;
    $('tplState').textContent = 'Reset to default';
    showPreview(); render(); toast('Default message restored');
  }
  function showPreview() {
    const first = leads.find(l => l.mobile) || leads[0];
    const name = first ? first.name : 'Sample Dental Clinic';
    $('tplPreview').textContent = currentTpl().replace(/\{name\}/g, name);
  }

  function waLink(l) {
    if (!l.mobile) return '';
    const msg = currentTpl().replace(/\{name\}/g, l.name);
    return `https://wa.me/91${l.mobile}?text=${encodeURIComponent(msg)}`;
  }

  function setStatus(id, v) { const l = leads.find(x => x.id === id); if (l) { l.status = v; save(); render(); } }
  function setNote(id, v) {
    const l = leads.find(x => x.id === id);
    if (!l) return false;
    l.notes = v;
    save();                       // written straight to localStorage
    return true;
  }
  // Save shortly after the user stops typing, so nothing is lost if the page is closed
  let noteTimer = null;
  function noteInput(id, v) {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => setNote(id, v), 400);
  }
  function noteSave(id, v) {
    clearTimeout(noteTimer);
    if (setNote(id, v)) toast('Note saved');
  }
  function del(id) { if (!confirm('Delete this lead?')) return; leads = leads.filter(x => x.id !== id); save(); render(); }

  function addManual() {
    const name = $('aName').value.trim(), digits = $('aPhone').value.replace(/\D/g,'').slice(-10);
    if (!name) return ($('aMsg').textContent = 'Enter a business name.');
    const isMob = /^[6-9]\d{9}$/.test(digits);
    leads.unshift({ id:'m'+Date.now(), name, phone:digits, mobile:isMob?digits:'', niche:$('aNiche').value.trim()||'Clinic', address:$('aAddr').value.trim(), city:'', rating:null, reviews:0, hours:'', maps:'', status:'New', notes:'', added:new Date().toLocaleDateString(), src:'manual' });
    save(); ['aName','aPhone','aNiche','aAddr'].forEach(i=>$(i).value=''); $('aMsg').textContent='Added.'; render();
  }

  // Import an Apify Google Places export (JSON array). New places are added as New; duplicates (same placeId) are skipped.
  function importApify(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let arr;
      try { arr = JSON.parse(r.result); } catch (e) { return toast('Not a valid JSON file'); }
      if (!Array.isArray(arr)) return toast('Expected a list of places');
      const have = new Set(leads.map(l => l.id));
      let added = 0;
      arr.forEach(x => {
        const pu = (x.phoneUnformatted || '').replace(/\s/g,'');
        const m = pu.match(/^\+91([6-9]\d{9})$/);
        const row = { id:x.placeId, name:(x.title||'').trim(), niche:x.categoryName||'Clinic', phone:pu.replace(/^\+91/,''), mobile:m?m[1]:'', address:x.address||'', city:x.city||'', rating:x.totalScore, reviews:x.reviewsCount||0,
          hours:(x.openingHours||[]).slice(0,7).map(h => `${h.day.slice(0,3)} ${h.hours}`).join(' · '), maps:x.url||'' };
        if (!row.id || !row.name || have.has(row.id)) return;
        leads.push(fromRow(row)); have.add(row.id); added++;
      });
      save(); render();
      toast(`${added} new lead${added===1?'':'s'} added from file`);
      $('importFile').value = '';
    };
    r.readAsText(file);
  }

  function exportData() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(leads, null, 2)], { type:'application/json' }));
    a.download = 'arunraj_leads_backup.json';
    a.click();
  }

  function render() {
    // Stats
    $('sTotal').textContent = leads.length;
    $('sWa').textContent = leads.filter(l => l.mobile).length;
    $('sCon').textContent = leads.filter(l => l.status === 'Contacted').length;
    $('sRep').textContent = leads.filter(l => l.status === 'Replied').length;
    $('sWon').textContent = leads.filter(l => l.status === 'Won').length;

    const q = $('q').value.trim().toLowerCase(), st = $('fStatus').value, onlyWa = $('fWa').checked;
    let list = leads.filter(l =>
      (!q || [l.name, l.phone, l.city, l.address].join(' ').toLowerCase().includes(q)) &&
      (!st || l.status === st) && (!onlyWa || l.mobile));
    const sort = $('fSort').value;
    list.sort((a, b) => sort === 'rev' ? (b.reviews||0)-(a.reviews||0) : sort === 'rate' ? (b.rating||0)-(a.rating||0) : a.name.localeCompare(b.name));

    if (!list.length) { $('list').innerHTML = '<div class="empty">No leads match. Import a file or change the filters.</div>'; return; }

    $('list').innerHTML = list.map(l => {
      const wa = waLink(l);
      const ratingTxt = l.rating ? `★ ${Number(l.rating).toFixed(1)} · ${l.reviews||0} reviews` : (l.reviews ? `${l.reviews} reviews` : 'No rating');
      return `<div class="card" data-st="${esc(l.status)}">
        <div class="top">
          <div>
            <div class="name">${esc(l.name)}</div>
            <div class="tags">
              <span class="tag">${esc(l.niche)}</span>
              ${l.mobile ? '<span class="tag ok">WhatsApp number</span>' : (l.phone ? '<span class="tag no">Landline / other</span>' : '<span class="tag no">No phone</span>')}
              ${l.src === 'apify' ? '<span class="tag">Google Maps</span>' : ''}
            </div>
          </div>
          <div style="text-align:right;font-size:12px;color:#64748b">${esc(l.added||'')}</div>
        </div>
        <div class="meta">
          ${l.phone ? `📞 <b>+91 ${esc(l.phone)}</b>` : '📞 <b>No number</b>'}<br>
          ${l.address ? `📍 ${esc(l.address)}<br>` : ''}
          ${l.hours ? `🕒 ${esc(l.hours)}<br>` : ''}
          ⭐ ${esc(ratingTxt)}
        </div>
        <div class="acts">
          <select onchange="setStatus('${l.id}', this.value)">
            ${['New','Contacted','Replied','Won','Rejected'].map(s => `<option ${s===l.status?'selected':''}>${s}</option>`).join('')}
          </select>
          ${wa ? `<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp chat</a>` : ''}
          ${l.phone ? `<a class="btn" href="tel:+91${esc(l.phone)}">Call</a>` : ''}
          ${l.maps ? `<a class="btn" href="${esc(l.maps)}" target="_blank" rel="noopener">Maps</a>` : ''}
          <button class="btn red" onclick="del('${l.id}')">Delete</button>
        </div>
        <textarea class="note" rows="1" placeholder="Notes (owner name, follow-up date...)" oninput="noteInput('${l.id}', this.value)" onblur="noteSave('${l.id}', this.value)">${esc(l.notes||'')}</textarea>
      </div>`;
    }).join('');
  }

  showPreview();
  render();
</script>
</body>
</html>
